<svg xmlns="http://www.w3.org/2000/svg" width="1147" height="1144" viewBox="53 54 1147 1144" role="img" aria-labelledby="title desc">
  <title id="title">Sim Agentation icon</title>
  <desc id="desc">A violet selection frame and a metallic fountain pen on a rounded light tile. Clean vector reconstruction with smooth gradients, crisp contours, and a transparent background.</desc>
  <defs>
