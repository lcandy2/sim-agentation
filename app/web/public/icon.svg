    </linearGradient>
    <radialGradient id="tile-light" cx="350" cy="310" r="970" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile-edge" x1="570" y1="52" x2="627" y2="1198" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4d4d6"/><stop offset=".08" stop-color="#e5e5e7"/><stop offset=".5" stop-color="#e4e4e5"/><stop offset=".93" stop-color="#d5d6d8"/><stop offset="1" stop-color="#bfc0c3"/>
    </linearGradient>
    <linearGradient id="selection-fill" x1="227" y1="151" x2="608" y2="494" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5944ff"/><stop offset="1" stop-color="#5943ff"/>
