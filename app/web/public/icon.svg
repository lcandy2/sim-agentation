    </linearGradient>
    <linearGradient id="face-right-shadow" x1="866" y1="733" x2="920" y2="716" gradientUnits="userSpaceOnUse">
      <stop stop-color="#737576" stop-opacity="0"/><stop offset=".55" stop-color="#87898b" stop-opacity=".53"/><stop offset=".8" stop-color="#f3f3f4" stop-opacity=".5"/><stop offset="1" stop-color="#fff"/>
