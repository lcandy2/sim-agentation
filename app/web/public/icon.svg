    </linearGradient>
    <filter id="selection-glow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#6953ff" flood-opacity=".3"/><feComposite in2="SourceAlpha" operator="in"/>
      <feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pen-shadow" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="soft-metal" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="edge-soften" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <g id="background">
    <use href="#tile" fill="url(#tile-edge)"/>
    <g clip-path="url(#tile-clip)">
      <use href="#tile" fill="url(#tile-fill)" stroke="url(#tile-edge)" stroke-width="10"/>
      <use href="#tile" fill="url(#tile-light)"/>
      <use href="#tile" fill="none" stroke="#fff" stroke-opacity=".68" stroke-width="4" transform="translate(0 5)" filter="url(#edge-soften)"/>
    </g>
  </g>

  <g id="selection" filter="url(#selection-glow)" fill="url(#selection-fill)">
    <rect x="226.5" y="151" width="381.5" height="342" fill="none" stroke="#5943ff" stroke-width="16"/>
    <g stroke="#fff" stroke-width="4">
      <rect x="202" y="126" width="50" height="50" rx="8"/>
      <rect x="583" y="126" width="50" height="50" rx="8"/>
      <rect x="202" y="468" width="50" height="50" rx="8"/>
      <rect x="583" y="468" width="50" height="50" rx="8"/>
    </g>
  </g>

  <g id="pen" clip-path="url(#tile-clip)">
    <path id="cast-shadow" d="M610 508C714 568 812 597 906 628C948 746 982 806 1051 862L1250 1000V1270H985C864 1073 773 886 660 811C645 708 652 614 610 508Z" fill="#32323c" opacity=".28" transform="translate(-27 40)" filter="url(#pen-shadow)"/>

