      <path d="M905 619C930 716 977 797 1034 844" fill="none" stroke="#8871ff" stroke-width="2.6" opacity=".7"/>
      <path d="M607 506C641 602 655 692 655 782Q655 791 663 795C747 845 810 904 867 982" fill="none" stroke="#7c65ed" stroke-width="2" opacity=".6"/>

      <use href="#nib-face" fill="url(#silver-face)" stroke="#929396" stroke-width="1.8" stroke-linejoin="round"/>
      <g clip-path="url(#face-clip)">
        <path d="M614 519C646 611 654 718 666 779C752 813 833 875 904 938L928 918C863 831 754 790 699 741C668 710 645 600 614 519Z" fill="url(#face-left-shadow)" filter="url(#soft-metal)"/>
        <path d="M844 599C868 686 892 785 962 888L1005 859C946 785 918 707 891 616Z" fill="url(#face-right-shadow)" filter="url(#soft-metal)"/>
        <path d="M887 616C912 719 942 788 994 856" fill="none" stroke="#fff" stroke-width="6" opacity=".85" filter="url(#edge-soften)"/>
        <path d="M611 510C644 605 660 698 666 779C756 812 835 869 901 932" fill="none" stroke="url(#face-edge)" stroke-width="3.2"/>
      </g>
      <path d="M609 499C698 558 789 587 889 615" fill="none" stroke="#fff" stroke-width="2.2"/>
      <path d="M608 502L776 689" fill="none" stroke="#25176c" stroke-width="6" stroke-linecap="round"/>
      <path d="M613 503L778 685" fill="none" stroke="#a29cbf" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="789" cy="707" rx="27" ry="25" transform="rotate(-31 789 707)" fill="url(#hole-fill)" stroke="#d5d5dd" stroke-width="2.3"/>
      <path d="M766 698C772 680 795 677 807 692" fill="none" stroke="#242237" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <g id="handle">
      <use href="#barrel" fill="url(#barrel-fill)" stroke="#2c215d" stroke-width="2.2"/>
      <use href="#barrel" fill="url(#barrel-length)"/>
      <g clip-path="url(#barrel-clip)">
        <path d="M1112 875L1201 971" fill="none" stroke="url(#barrel-edge)" stroke-width="5.5" filter="url(#edge-soften)"/>
        <path d="M899 1050C915 1091 950 1135 985 1191" fill="none" stroke="#7460fb" stroke-width="3.2" opacity=".65"/>
      </g>
    </g>

    <g id="metal-collar">
      <use href="#collar" fill="url(#collar-fill)" stroke="#717474" stroke-width="2.8" stroke-linejoin="round"/>
      <use href="#collar" fill="url(#collar-cross)"/>
      <path d="M862 1031C864 1004 892 962 929 926C983 875 1044 837 1078 842" fill="none" stroke="#fff" stroke-width="2.2" opacity=".93" stroke-linecap="round"/>
      <path d="M888 1071C882 1038 921 985 969 941C1023 892 1084 861 1116 875" fill="none" stroke="#282637" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M890 1065C894 1036 926 988 973 946C1026 897 1084 867 1113 876" fill="none" stroke="#dddce3" stroke-width="1.5" opacity=".75"/>
    </g>
  </g>
</svg>
