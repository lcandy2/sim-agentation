    <clipPath id="face-clip"><use href="#nib-face"/></clipPath>
    <clipPath id="barrel-clip"><use href="#barrel"/></clipPath>
    <linearGradient id="tile-fill" x1="310" y1="125" x2="909" y2="1175" gradientUnits="userSpaceOnUse">
