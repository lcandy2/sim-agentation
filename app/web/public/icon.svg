    <path id="nib-face" d="M609 500C692 554 784 585 890 615C914 719 945 793 1000 858C963 880 929 906 901 936C834 861 762 815 667 784Q663 782 663 771C662 675 640 574 606 505Q605 501 609 500Z"/>
    <path id="barrel" d="M1118 871L1230 985L1290 1260H995L890 1075C880 1042 917 989 967 941C1024 889 1085 854 1118 871Z"/>
    <path id="collar" d="M888 1075C876 1061 869 1052 863 1043C847 1015 884 963 925 923C980 871 1042 832 1079 839Q1090 841 1099 852L1120 876C1089 857 1024 889 968 940C920 984 882 1038 888 1075Z"/>
