    </linearGradient>
    <linearGradient id="right-rim" x1="923" y1="750" x2="951" y2="731" gradientUnits="userSpaceOnUse">
      <stop stop-color="#271566"/><stop offset=".29" stop-color="#332091"/><stop offset=".62" stop-color="#6145ff"/><stop offset=".9" stop-color="#4a2dd1"/><stop offset="1" stop-color="#291a77"/>
    </linearGradient>
    <linearGradient id="lower-rim" x1="760" y1="886" x2="811" y2="824" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6043ee"/><stop offset=".21" stop-color="#2f217c"/><stop offset=".49" stop-color="#15113c"/><stop offset=".8" stop-color="#252064"/><stop offset="1" stop-color="#4936a6"/>
    </linearGradient>
    <linearGradient id="silver-face" x1="612" y1="501" x2="942" y2="909" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f7f8"/><stop offset=".26" stop-color="#ececed"/><stop offset=".7" stop-color="#e4e4e5"/><stop offset="1" stop-color="#bfc0c3"/>
    </linearGradient>
    <linearGradient id="face-left-shadow" x1="718" y1="808" x2="752" y2="758" gradientUnits="userSpaceOnUse">
