    </radialGradient>
    <linearGradient id="barrel-fill" x1="944" y1="1117" x2="1137" y2="953" gradientUnits="userSpaceOnUse">
      <stop stop-color="#241866"/><stop offset=".075" stop-color="#6349ef"/><stop offset=".17" stop-color="#312089"/><stop offset=".27" stop-color="#180e50"/><stop offset=".45" stop-color="#221471"/><stop offset=".63" stop-color="#3824be"/><stop offset=".76" stop-color="#6953ff"/><stop offset=".85" stop-color="#a194ff"/><stop offset=".93" stop-color="#4c34d3"/><stop offset="1" stop-color="#292071"/>
    </linearGradient>
