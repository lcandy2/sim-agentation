name: Tap

# Points the formula in lcandy2/homebrew-tap at a release, through the
# tap's own bump workflow (it writes as the tap's GitHub App). The release
# workflow calls it once the release is published; run it by hand to redo
# one.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Released version, like 0.2.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  formula:
    uses: lcandy2/homebrew-tap/.github/workflows/bump.yml@main
    with:
      formula: sim-agentation
      url: https://github.com/lcandy2/sim-agentation/releases/download/${{ inputs.version }}/sim-agentation-${{ inputs.version }}-macos-arm64.tar.gz
    secrets:
      app-private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
