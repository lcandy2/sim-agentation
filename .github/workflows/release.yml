name: Release

# A version tag (0.2.0, no "v": the SDK's Swift package uses the same tags)
# builds the Mac side, attaches the tarball to a GitHub release, and points
# the Homebrew formula in lcandy2/homebrew-tap at it.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches Config.version
        run: |
          version=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' app/host/Sources/sim-agentation/Config.swift)
          test "$version" = "$TAG" || { echo "Config.version is $version, the tag is $TAG"; exit 1; }
      - name: Package
        run: app/scripts/package.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/sim-agentation-$TAG-macos-arm64.tar.gz --title "$TAG" --generate-notes
      - name: Update the Homebrew formula
        if: env.TAP_TOKEN != ''
        run: |
          sha=$(shasum -a 256 dist/sim-agentation-$TAG-macos-arm64.tar.gz | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/lcandy2/homebrew-tap.git" tap
          sed -i '' -E \
            -e "s|^  url \".*\"|  url \"https://github.com/lcandy2/sim-agentation/releases/download/$TAG/sim-agentation-$TAG-macos-arm64.tar.gz\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" \
            tap/Formula/sim-agentation.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sim-agentation $TAG"
          git push
